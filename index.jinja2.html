<script>
// Decompresses base64 encoded GZIP string. Retruns a string with original text.
const decompress = (base64string) => {
    const bytes = Uint8Array.from(atob(base64string), c => c.charCodeAt(0));
    const decompressedBytes = pako.inflate(bytes);
    return new TextDecoder().decode(decompressedBytes);
}


let dataGz = '{{ data }}'
let data = JSON.parse(decompress(dataGz))
</script>
<script>
var table = new DataTable('#myTable', {
    responsive: true,
    data: data,
    columns: {{ columns }},
    order: [[1, '⬆️']],
    lengthMenu: [
        [10, 25, 50, -1],
        [10, 25, 50, 'All']
    ],
    pageLength: 20,
    columnDefs: [
        {
            targets: 1,
            className: 'noVis'
        }
    ],
    search: {
        // https://datatables.net/reference/type/DataTables.SearchOptions
        regex: true,
        caseInsensitive: true,
        smart: true
    },
    layout: {
        topStart: {
            buttons: [
                 'colvis', 'searchBuilder', 'copy', 'excel', 'pdf','createState', 'savedStates'
            ], 
        },
    },
    initComplete: function () {
        this.api()
            .columns()
            .every(function () {
                let column = this;
                let title = column.footer().textContent;
 
                // Create input element
                let input = document.createElement('input');
                input.className = 'form-control';
                input.placeholder = title;
                column.footer().replaceChildren(input);

                let searchOptions = {
                    // regex: true,
                    caseInsensitive: true,
                    smart: true
                };
 
                // Event listener for user input
                input.addEventListener('keyup', () => {
                    if (column.search() !== this.value) {
                        column.search(input.value, searchOptions).draw();
                    }
                });
            });
    },

});
// // Add event listeners to the two range filtering inputs
$('#min').keyup( function() { table.draw(); } );
$('#max').keyup( function() { table.draw(); } );

</script>
